name: Build Windows exe

on:
  release:
    types: [published]
  workflow_dispatch: {}  # handmatig te starten voor een testbuild, zonder release

permissions:
  contents: write  # nodig om de gebouwde exe als release-asset te mogen uploaden

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Fetch LibreDWG (pinned, checksum-verified)
        run: python scripts/fetch_libredwg.py

      - name: Run tests
        run: pytest tests -q

      - name: Build exe
        run: |
          pyinstaller packaging/floorplan_cleaner.spec --noconfirm --distpath packaging/dist --workpath packaging/build

      - name: Smoke-test the exe
        shell: pwsh
        run: |
          # --onefile spawnt een APART kind-proces (de uitgepakte, echt
          # draaiende app) naast het bootloader-proces dat Start-Process
          # teruggeeft - de luisterende poort hoort bij dat kind, niet bij
          # $proc.Id zelf. Daarom op NAAM controleren (elk gevonden PID),
          # niet op de losse PID van Start-Process. Ruime timeout: een
          # koude start van een ~80MB onefile-exe (uitpakken + numpy/scipy
          # laden) kan op een CI-runner meer dan de eerdere 35s duren.
          Start-Process -FilePath "packaging\dist\FloorplanCleaner.exe"
          $port = $null
          $deadline = (Get-Date).AddSeconds(90)
          while ((Get-Date) -lt $deadline) {
            $procs = Get-Process -Name "FloorplanCleaner" -ErrorAction SilentlyContinue
            foreach ($p in $procs) {
              $conn = Get-NetTCPConnection -State Listen -OwningProcess $p.Id -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($conn) {
                $port = $conn.LocalPort
                break
              }
            }
            if ($port) { break }
            Start-Sleep -Seconds 3
          }
          if (-not $port) {
            Get-Process -Name "FloorplanCleaner" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Write-Error "De .exe kwam niet met een luisterende poort binnen de tijd - build afgekeurd."
            exit 1
          }
          Write-Host "OK: exe start en luistert op poort $port."

          # DWG-route in de gebouwde exe: meegeleverde dwg2dxf + ezdxf moeten werken.
          try {
            $resp = Invoke-WebRequest -Uri "http://127.0.0.1:$port/upload" -Method Post `
              -Form @{ pdf = Get-Item "tests\fixtures\simple_floorplan.dwg" } -TimeoutSec 120
            $data = $resp.Content | ConvertFrom-Json
          } finally {
            Get-Process -Name "FloorplanCleaner" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          if ($data.source_type -ne "dwg" -or $data.layers.Count -lt 1) {
            Write-Error "DWG-upload in de exe gaf geen lagen terug - build afgekeurd."
            exit 1
          }
          Write-Host "OK: DWG-upload werkt in de exe ($($data.layers.Count) lagen)."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloorplanCleaner-windows
          path: packaging/dist/FloorplanCleaner.exe

      # GPL-3: bij de meegeleverde LibreDWG-programma's horen de licentie en
      # de bijbehorende broncode, daarom die als extra bijlagen bij de release.
      - name: Attach exe to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/dist/FloorplanCleaner.exe
            THIRD_PARTY_NOTICES.md
            vendor/libredwg/LibreDWG-COPYING.txt
            vendor/libredwg/libredwg-0.14.tar.xz
