<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Floorplan cleaner{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <header class="topbar">
    <h1>Floorplan cleaner <span class="app-version">v{{ app_version }}</span>
      {%- if file_name %} <span class="app-file" title="{{ file_name }}"><span class="app-file-label">File:</span> {{ file_name }}</span>{% endif %}</h1>
    <a class="topbar-link" href="/licenses" target="_blank" rel="noopener">Licenses</a>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
